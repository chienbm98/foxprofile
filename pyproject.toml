[project]
name = "foxprofile"
version = "2.1.0"
description = "Anti-detect browser profile manager for Camoufox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "camoufox_data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI declares dependencies as Depends(...) defaults
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
