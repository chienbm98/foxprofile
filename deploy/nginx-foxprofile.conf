# /etc/nginx/sites-available/foxprofile
# Replace foxprofile.example.com, enable with:
#   ln -s /etc/nginx/sites-available/foxprofile /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d foxprofile.example.com --redirect
# No domain? <ip-with-dashes>.sslip.io resolves to that IP and gets a certificate too.
server {
    listen 80;
    listen [::]:80;
    server_name foxprofile.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Launches wait for the browser; MCP responses stream.
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
