name: Release

# Builds the desktop installers (Windows Setup .exe, macOS .dmg) with FoxProfile's patched
# Camoufox bundled inside (from the CAMOUFOX_TAG release).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Release in this repo holding FoxProfile's Camoufox builds (patches/foxprofile-session-key.patch)
  CAMOUFOX_TAG: camoufox-v156.0.1-beta.36-fp1

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # attach the installer to the tag's release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        shell: bash
        # requirements.lock is a macOS/py3.14 freeze: drop the packages that have no Windows
        # wheels (pyobjc-*, uvloop); requirements.txt adds the Windows-only tzdata.
        run: |
          grep -v -i -E '^(pyobjc|uvloop)' requirements.lock > requirements.win.lock
          python -m pip install -r requirements.win.lock -r requirements.txt -r requirements-build.txt
      - name: Build app (PyInstaller via flet pack)
        shell: bash
        run: bash packaging/pack.sh --icon src/assets/icon.ico
      - name: Bundle the patched Camoufox
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CAMOUFOX_TAG" -p '*-win.x86_64.zip' -D "$RUNNER_TEMP/camoufox"
          bash packaging/bundle_browser.sh "$RUNNER_TEMP"/camoufox/*-win.x86_64.zip dist/FoxProfile/browser
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" packaging\windows\foxprofile.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Tag builds go to the release; keep manual test builds only briefly (Actions storage is 0.5 GB).
      - uses: actions/upload-artifact@v4
        if: \"!startsWith(github.ref, 'refs/tags/v')\"
        with:
          name: FoxProfile-Setup-windows
          path: dist/FoxProfile-Setup-*.exe
          retention-days: 1
          if-no-files-found: error
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: awk -v v="## [${GITHUB_REF_NAME#v}]" 'index($0,v)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FoxProfile-Setup-*.exe
          body_path: ${{ runner.temp }}/notes.md

  macos:
    runs-on: macos-latest # Apple Silicon (arm64)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.lock -r requirements-build.txt
      - name: Fetch the patched Camoufox
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$CAMOUFOX_TAG" -p '*-mac.arm64.zip' -D "$RUNNER_TEMP/camoufox"
      - run: CAMOUFOX_ZIP=$(ls "$RUNNER_TEMP"/camoufox/*-mac.arm64.zip) bash packaging/build_macos.sh
      # Tag builds go to the release; keep manual test builds only briefly (Actions storage is 0.5 GB).
      - uses: actions/upload-artifact@v4
        if: \"!startsWith(github.ref, 'refs/tags/v')\"
        with:
          name: FoxProfile-dmg-macos-arm64
          path: dist/FoxProfile-*.dmg
          retention-days: 1
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FoxProfile-*.dmg
