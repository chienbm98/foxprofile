name: ✨ 功能建议 / Feature request
description: 提出一个功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 这个功能要解决什么困难？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与贡献
      options:
        - label: 我愿意自己为这个功能提交 Pull Request
