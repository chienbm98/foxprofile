name: 🐛 Bug 报告 / Bug report
description: 报告一个 bug，帮助我们修复
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告 bug！粘贴日志前，请**删除 cookie、带密码的 proxy 和账号信息**。
        安全漏洞请按 [SECURITY.md](../blob/main/SECURITY.md) 私下报告。
  - type: textarea
    id: what
    attributes:
      label: Bug 描述
      description: 发生了什么？你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 创建一个带 socks5 proxy 的 macOS profile
        2. 点击 Launch
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FoxProfile 版本 / commit
      placeholder: "2.0.0 或 abc1234"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 本机操作系统
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "3.12.4"
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: `logs/` 目录中的片段
      render: text
